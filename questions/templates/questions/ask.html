{% extends "core/base.html" %}
{% load static %}
{% block title %}Новый вопрос{% endblock %}
{% block content %}

<h1>Новый вопрос</h1>
<form class="editor-form question-form" method="post" novalidate>
    {% csrf_token %}
    <div class="alert alert-danger" hidden role="alert"></div>
    <div class="field-row">
        <label for="title">Заголовок</label>
        <div>
            <input aria-describedby="title-hint" class="form-control" id="title" maxlength="150" name="title" required type="text" value="">
            <div class="form-text" id="title-hint">Кратко сформулируйте вопрос. До 150 символов.</div>
        </div>
    </div>
    <div class="field-row">
        <label for="text">Текст</label>
        <div>
            <textarea aria-describedby="text-hint" class="form-control" id="text" maxlength="5000" name="text" required rows="7"></textarea>
            <div class="form-text" id="text-hint">Опишите задачу и то, что уже попробовали. До 5000 символов.</div>
        </div>
    </div>
    <div class="field-row">
        <label for="tags">Теги</label>
        <div>
            <input aria-describedby="tags-hint" class="form-control" id="tags" maxlength="150" name="tags" required type="text" value="">
            <div class="form-text" id="tags-hint">До 3 тегов через запятую.</div>
        </div>
    </div>
    <div class="form-action">
        <button class="btn btn-success" type="submit">Опубликовать вопрос</button>
        <p class="form-result" role="status"></p>
    </div>
</form>

{% endblock %}
