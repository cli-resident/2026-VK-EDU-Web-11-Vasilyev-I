{% load static %}
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="{% url 'questions:index' %}">AskRu</a>
        <form action="{% url 'questions:index' %}" class="search" role="search">
            <label class="visually-hidden" for="search">Поиск вопросов</label>
            <input id="search" name="q" placeholder="Поиск" value="{{ query }}" type="search">
            <button aria-label="Искать" type="submit">Найти</button>
        </form>
        {% if user.is_authenticated %}<a class="btn btn-success ask-button" href="{% url 'questions:ask' %}">Задать вопрос</a>{% else %}<button class="btn btn-success ask-button" disabled title="Войдите, чтобы задать вопрос">Задать вопрос</button>{% endif %}
        {% if user.is_authenticated %}
        <div class="user-block">
            <img alt="Аватар автора" class="avatar" height="56" src="{{ user.profile.avatar_url }}" width="56">
            <div>
                <strong>{{ user.profile }}</strong>
                <div>
                    <a href="{% url 'core:profile' %}">Настройки</a>
                    <form method="post" action="{% url 'core:logout' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="btn btn-link p-0" type="submit">Выйти</button></form>
                </div>
            </div>
        </div>
        {% else %}
        <div class="guest-links">
            <a href="{% url 'core:login' %}">Войти</a>
            <a class="signup-link" href="{% url 'core:signup' %}">Регистрация</a>
        </div>
        {% endif %}
    </div>
</header>
